<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Attendance - Believable HRMS</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

.header{
    background:#0d6efd;
    color:white;
    padding:15px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

button{
    padding:12px 25px;
    background:#198754;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#157347;
}

</style>

</head>

<body>

<div class="header">
    <h2>Attendance</h2>
</div>

<div class="container">

<div class="card">

<h3>Employee Attendance</h3>

<p>Employee ID</p>

<input
    type="text"
    id="employeeId"
    placeholder="Enter Employee ID"
>

<br><br>

<button onclick="checkIn()">
    Check In
</button>

<p id="message"></p>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/attendance.js"></script>

</body>
</html>
