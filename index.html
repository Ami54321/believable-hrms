<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Believable HRMS</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            width:350px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,.2);
        }

        h2{
            text-align:center;
            color:#0d6efd;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:15px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:10px;
            background:#0d6efd;
            color:white;
            border:none;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0b5ed7;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Believable HRMS</h2>

    <input type="text" id="userid" placeholder="Employee ID">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">
        Login
    </button>

</div>

<script>

function login(){

    let id=document.getElementById("userid").value;
    let pass=document.getElementById("password").value;

    if(id==="ADMIN" && pass==="admin123"){
        window.location.href = "admin.html";
    }
    else{
        alert("Invalid Login");
    }

}

</script>

</body>
</html>
