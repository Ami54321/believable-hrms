<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Believable HRMS</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            width:350px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,.2);
        }

        h2{
            text-align:center;
            color:#0d6efd;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:15px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:10px;
            background:#0d6efd;
            color:white;
            border:none;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0b5ed7;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Believable HRMS</h2>

    <input type="text" id="userid" placeholder="Email Address">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">
        Login
    </button>

</div>

<script>

async function login() {
    const email = document.getElementById("userid").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Please enter your email and password.");
        return;
    }

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        alert("Login failed. Please check your email and password.");
        return;
    }

    const { data: employee, error: employeeError } = await supabaseClient
        .from("employees")
        .select("employee_id, role, status")
        .eq("email", email)
        .maybeSingle();

    if (employeeError || !employee || employee.status !== "Active") {
        await supabaseClient.auth.signOut();
        alert("Your HRMS account is not linked to an active employee record. Please contact the admin.");
        return;
    }

    if (employee.role === "Admin") {
        window.location.href = "admin.html";
    } else if (employee.role === "Employee") {
        window.location.href = "employee.html";
    } else {
        await supabaseClient.auth.signOut();
        alert("Your account role is not configured correctly.");
    }
}

</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
</body>
</html>
