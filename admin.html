<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Believable HRMS</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

.sidebar{
    width:220px;
    height:100vh;
    background:#0d6efd;
    color:white;
    float:left;
}

.sidebar h2{
    text-align:center;
    padding:20px;
}

.sidebar button{
    width:90%;
    margin:10px;
    padding:12px;
    border:none;
    background:white;
    cursor:pointer;
    font-size:16px;
}

.main{
    margin-left:220px;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th, td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

th{
    background:#0d6efd;
    color:white;
}

.approve{
    background:#198754;
    color:white;
    border:none;
    padding:8px 12px;
    cursor:pointer;
    border-radius:4px;
}

.reject{
    background:#dc3545;
    color:white;
    border:none;
    padding:8px 12px;
    cursor:pointer;
    border-radius:4px;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>Believable HRMS</h2>

<button>
🏠 Dashboard
</button>

<button onclick="window.location.href='employee.html'">
👥 Employees
</button>

<button onclick="window.location.href='attendance.html'">
📅 Attendance
</button>

<button>
🌴 Leave
</button>

<button>
Logout
</button>

</div>


<div class="main">

<div class="card">

<h2>Welcome Admin 👋</h2>

<p>Believable Financial Services Pvt. Ltd.</p>

<p>HRMS Dashboard is ready.</p>

<hr>

<h2>Late Regularization Requests</h2>

<table>

<thead>

<tr>
<th>Employee ID</th>
<th>Date</th>
<th>Reason</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody id="regularizationTable">

<tr>
<td colspan="5">Loading...</td>
</tr>

</tbody>

</table>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/admin.js"></script>

    
<hr>

<h2>Employee Leave Requests</h2>

<table border="1" cellpadding="10" cellspacing="0" width="100%">
    <thead>
        <tr>
            <th>Employee ID</th>
            <th>Leave Type</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="leaveRequestsTable">
        <tr>
            <td colspan="7">Loading leave requests...</td>
        </tr>
    </tbody>
</table>

</body>

</html>
