<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Believable HRMS - Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="bg-primary text-white p-3 vh-100" style="width:260px;">

        <h3>Believable HRMS</h3>
        <hr>

        <button class="btn btn-light w-100 mb-2">🏠 Dashboard</button>

        <button
    class="btn btn-outline-light w-100 mb-2"
    onclick="window.location.href='employee.html'">
    👥 Employees
</button>

        <button class="btn btn-outline-light w-100 mb-2">
            📅 Attendance
        </button>

        <button class="btn btn-outline-light w-100 mb-2">
            🌴 Leave
        </button>

        <button class="btn btn-outline-light w-100 mb-2">
            ⏰ Late Regularization
        </button>

        <button class="btn btn-danger w-100 mt-5">
            Logout
        </button>

    </div>

    <!-- Main Area -->
    <div class="container-fluid p-4">

        <h2>Welcome Admin 👋</h2>

        <p>Believable Financial Services Pvt. Ltd.</p>

        <div class="row mt-4">

            <div class="col-md-3">

                <div class="card shadow">

                    <div class="card-body text-center">

                        <h5>Total Employees</h5>

                        <h1 id="totalEmployees">0</h1>

                    </div>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card shadow">

                    <div class="card-body text-center">

                        <h5>Present Today</h5>

                        <h1>0</h1>

                    </div>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card shadow">

                    <div class="card-body text-center">

                        <h5>On Leave</h5>

                        <h1>0</h1>

                    </div>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card shadow">

                    <div class="card-body text-center">

                        <h5>Late Today</h5>

                        <h1>0</h1>

                    </div>

                </div>

            </div>

        </div>

        <div class="card mt-5 shadow">

            <div class="card-body">

                <div class="d-flex justify-content-between">

                    <h4>Employees</h4>

                    <button class="btn btn-success">
                        + Add Employee
                    </button>

                </div>

                <hr>

                <table class="table">

                    <thead>

                        <tr>

                            <th>Employee ID</th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="employeeTable">

                        <tr>

                            <td colspan="4" class="text-center">

                                No Employees Found

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
