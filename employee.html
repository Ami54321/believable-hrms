<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management - Believable HRMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Employee Management</h3>
        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-4">
                    <label>Employee ID</label>
                    <input type="text" id="employeeId" class="form-control">
                </div>

                <div class="col-md-4">
                    <label>Full Name</label>
                    <input type="text" id="fullName" class="form-control">
                </div>

                <div class="col-md-4">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control">
                </div>

            </div>

            <div class="row mt-3">

                <div class="col-md-4">
                    <label>Leave Balance</label>
                    <input type="number" id="leaveBalance" class="form-control" value="12">
                </div>

                <div class="col-md-4">
                    <label>Status</label>

                    <select id="status" class="form-control">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>

                </div>

            </div>

            <button class="btn btn-success mt-4" id="saveEmployeeBtn">
                Save Employee
            </button>

        </div>

    </div>

    <div class="card shadow mt-4">

        <div class="card-header">
            <h4>Employee List</h4>
        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <thead>

                    <tr>
                        <th>Employee ID</th>
                        <th>Name</th>
                        <th>Leave</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody id="employeeTable">

                    <tr>
                        <td colspan="4" class="text-center">
                            No Employees Added Yet
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
