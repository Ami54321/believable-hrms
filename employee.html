<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Employee Management</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

.header{
    background:#0d6efd;
    color:white;
    padding:15px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table, th, td{
    border:1px solid #ddd;
}

th, td{
    padding:10px;
    text-align:left;
}

/* Form Style */

input, select{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    padding:10px 20px;
    background:#0d6efd;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#0b5ed7;
}

</style>

</head>

<body>

<div class="header">
    <h2>Employee Management</h2>
</div>

<div class="container">

<div class="card">

<h3>Add Employee</h3>

<p>
Employee ID
</p>

<input type="text" id="empid" placeholder="Employee ID">

<p>
Full Name
</p>

<input type="text" id="fullname" placeholder="Full Name">

<p>
Password
</p>

<input type="password" id="password" placeholder="Password">

<p>
Status
</p>

<select id="status">

<option>Active</option>

<option>Inactive</option>

</select>

<br><br>

<button onclick="addEmployee()">Add Employee</button>

<hr>

<h3>Employee List</h3>

<input
    type="text"
    id="searchBox"
    placeholder="Search Employee..."
    onkeyup="searchEmployee()">

<table>

<thead>
<tr>
<th>Employee ID</th>
<th>Name</th>
<th>Password</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="employeeTable">

<tr>
<td colspan="5" style="text-align:center;">
No Employees Added Yet
</td>
</tr>

</tbody>

</table>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/employee.js"></script>

    
<hr>

<h2>Apply for Leave</h2>

<div>
    <label>Employee ID:</label><br>
    <input type="text" id="leaveEmployeeId" placeholder="Enter Employee ID">
    <br><br>

    <label>Leave Type:</label><br>
    <select id="leaveType">
        <option value="Casual Leave">Casual Leave</option>
    </select>
    <br><br>

    <label>Start Date:</label><br>
    <input type="date" id="leaveStartDate">
    <br><br>

    <label>End Date:</label><br>
    <input type="date" id="leaveEndDate">
    <br><br>

    <label>Reason:</label><br>
    <textarea id="leaveReason" placeholder="Enter reason for leave"></textarea>
    <br><br>

    <button onclick="applyLeave()">Submit Leave Application</button>

    <p id="leaveMessage"></p>
</div>    
<script src="js/leave.js"></script>
</body>
</html>
