
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Believable HRMS - Employee Management</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f6fb;
    color: #222;
}

.header {
    background: #0d6efd;
    color: white;
    padding: 18px 24px;
}

.header h2 {
    margin: 0;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 15px;
}

.card {
    background: white;
    padding: 22px;
    margin-bottom: 22px;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h3 {
    margin-top: 0;
    color: #17365d;
}

label {
    display: block;
    margin: 12px 0 6px;
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    padding: 11px;
    margin-bottom: 12px;
    border: 1px solid #ccd3dd;
    border-radius: 5px;
    font: inherit;
}

textarea {
    min-height: 85px;
    resize: vertical;
}

button {
    padding: 10px 17px;
    background: #0d6efd;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 5px;
    font-size: 14px;
}

button:hover {
    background: #0b5ed7;
}

hr {
    border: 0;
    border-top: 1px solid #e0e5ec;
    margin: 24px 0;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 11px;
    text-align: left;
    border: 1px solid #ddd;
}

th {
    background: #eef3fb;
}

.message {
    margin-top: 12px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.balance-result {
    margin-top: 15px;
    padding: 14px;
    background: #eef6ff;
    border-radius: 6px;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="header">
    <h2>Believable HRMS</h2>
    <p>Employee Management</p>
</div>

<div class="container">

    <!-- EMPLOYEE MANAGEMENT -->
    <div class="card">
        <h3>Add Employee</h3>

        <label for="empid">Employee ID</label>
        <input type="text" id="empid" placeholder="Employee ID">

        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="Full Name">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password">

        <label for="status">Status</label>
        <select id="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select>

        <button onclick="addEmployee()">Add Employee</button>

        <hr>

        <h3>Employee List</h3>
        <input
            type="text"
            id="searchBox"
            placeholder="Search Employee..."
            onkeyup="searchEmployee()">

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Name</th>
                        <th>Password</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="employeeTable">
                    <tr>
                        <td colspan="5" style="text-align:center;">
                            Loading employees...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- LEAVE BALANCE -->
    <div class="card">
        <h3>My Leave Balance</h3>
        <p>Enter your Employee ID to check your remaining Casual Leaves.</p>

        <label for="balanceEmployeeId">Employee ID</label>
        <input
            type="text"
            id="balanceEmployeeId"
            placeholder="Example: E001">

        <button onclick="checkLeaveBalance()">Check Leave Balance</button>

        <div id="leaveBalanceResult" class="balance-result">
            Your remaining leaves will appear here.
        </div>
    </div>

    <!-- APPLY FOR LEAVE -->
    <div class="card">
        <h3>Apply for Leave</h3>

        <label for="leaveEmployeeId">Employee ID</label>
        <input
            type="text"
            id="leaveEmployeeId"
            placeholder="Enter Employee ID">

        <label for="leaveType">Leave Type</label>
        <select id="leaveType">
            <option value="Casual Leave">Casual Leave</option>
        </select>

        <label for="leaveStartDate">Start Date</label>
        <input type="date" id="leaveStartDate">

        <label for="leaveEndDate">End Date</label>
        <input type="date" id="leaveEndDate">

        <label for="leaveReason">Reason</label>
        <textarea id="leaveReason" placeholder="Enter reason for leave"></textarea>

        <button onclick="applyLeave()">Submit Leave Application</button>

        <p id="leaveMessage" class="message"></p>
    </div>

</div>

<!-- LOAD SUPABASE AND EXISTING APP SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/employee.js"></script>
<script src="js/leave.js"></script>

<script>
async function checkLeaveBalance() {
    const employeeId =
        document.getElementById("balanceEmployeeId").value.trim();
    const result = document.getElementById("leaveBalanceResult");

    if (!employeeId) {
        result.textContent = "Please enter your Employee ID.";
        return;
    }

    result.textContent = "Checking balance...";

    try {
        const { data, error } = await supabaseClient
            .from("employees")
            .select("leave_balance")
            .eq("employee_id", employeeId)
            .eq("status", "Active")
            .maybeSingle();

        if (error) {
            console.error("Leave balance error:", error);
            result.textContent =
                "Could not load balance. Please try again.";
            return;
        }

        if (!data) {
            result.textContent =
                "Active employee not found. Please check the Employee ID.";
            return;
        }

        result.textContent =
            "Remaining Casual Leaves: " + data.leave_balance;
    } catch (err) {
        console.error(err);
        result.textContent =
            "Something went wrong while checking the balance.";
    }
}
</script>

</body>
</html>
