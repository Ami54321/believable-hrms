<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Employee Management</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

.header{
    background:#0d6efd;
    color:white;
    padding:15px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table, th, td{
    border:1px solid #ddd;
}

th, td{
    padding:10px;
    text-align:left;
}

/* Form Style */

input, select{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    padding:10px 20px;
    background:#0d6efd;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#0b5ed7;
}

</style>

</head>

<body>

<div class="header">
    <h2>Employee Management</h2>
</div>

<div class="container">

<div class="card">

<h3>Add Employee</h3>

<p>
Employee ID
</p>

<input type="text" id="empid" placeholder="Employee ID">

<p>
Full Name
</p>

<input type="text" id="fullname" placeholder="Full Name">

<p>
Password
</p>

<input type="password" id="password" placeholder="Password">

<p>
Status
</p>

<select id="status">

<option>Active</option>

<option>Inactive</option>

</select>

<br><br>

<button onclick="addEmployee()">Add Employee</button>

<hr>

<h3>Employee List</h3>

<table>

<tr>
<th>Employee ID</th>
<th>Name</th>
<th>Status</th>
</tr>

<tr>
<td colspan="3" style="text-align:center;">
No Employees Added Yet
</td>
</tr>

</table>

</div>

</div>

<script src="js/employee.js"></script>

</body>
</html>
